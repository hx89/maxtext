# 4-layer version of DeepSeek-V4-Pro: production shapes, fewer layers for fast multi-step tests.
#
# Designed to exercise every V4-specific code path with full embedding/expert dims.
# MTP is OFF by default, mirroring the V3 convention (`deepseek3-tiny.yml` also leaves this off).
# To exercise the MTP path, override on the CLI: `mtp_num_layers=1 mtp_loss_scaling_factor=0.1`
# (and extend compress_ratios with one more entry once that knob is re-enabled).
#
# When fully wired up:
#   * 4 main layers (+ 1 MTP layer when enabled)
#   * num_hash_layers=2 → first 2 layers use hash routing, remaining 2 use sqrtsoftplus gating
#   * compress_ratios alternates 16/4/16/0 → exercises sliding+compressed (ratio 16),
#     sliding+compressed+indexer (ratio 4), and pure sliding window (ratio 0)
#   * single_latent_kv + grouped output LoRA on
#   * mHC at expansion_rate=4 with learned head collapse

base_emb_dim: 7168
base_num_query_heads: 128
base_num_kv_heads: 128                # TODO(V4): change to 1 when single-latent MLA is implemented (V3-style MLA requires num_kv_heads == num_query_heads)
base_mlp_dim: 3072                    # must equal base_moe_mlp_dim when first_num_dense_layers=0
base_moe_mlp_dim: 3072
base_num_decoder_layers: 4
first_num_dense_layers: 0             # all-MoE stack (V4 has no dense FFN layers)
mlp_activations: ["silu","linear"]
vocab_size: 129280
enable_dropout: False
logits_via_embedding: False
normalization_layer_epsilon: 1.0e-6

# MoE: tiny + V4 routing
num_experts: 384
num_experts_per_tok: 6
shared_experts: 1
routed_scaling_factor: 2.5
routed_score_func: "sqrtsoftplus"     # V4: sqrt(softplus(logits))
routed_bias: True                     # noaux_tc: bias-only top-k
n_routing_groups: -1                  # disable expert grouping (V4 uses flat top-k)
topk_routing_group: -1
# TODO(V4): re-enable when swiglu_limit is implemented
# swiglu_limit: 10.0                  # V4: clamp gate/up on routed experts
# TODO(V4): re-enable when hash routing is implemented
num_hash_layers: 0                    # V4: first 2 layers use frozen tid2eid lookup (disabled for now)
decoder_block: "deepseek"

# MLA — V4 shape (tiny)
# TODO(V4): single_latent_kv=True + kv_lora_rank=0 needs MLA code changes (Phase 3).
# For now, use V3-style MLA with small kv_lora_rank to exercise MoE/routing paths.
attention_type: "mla"
q_lora_rank: 1536
kv_lora_rank: 512                     # TODO(V4): change to 0 when single-latent MLA is implemented
qk_nope_head_dim: 128                 # V3 default; V4 uses head_dim 512 = 448 nope + 64 rope
qk_rope_head_dim: 64
v_head_dim: 128  
# TODO(V4): re-enable these when single-latent MLA is implemented
# o_groups: 2                         # V4: grouped low-rank output projection
# o_lora_rank: 16
# single_latent_kv: True
# attention_sink_in_mla: True
# inverse_rope_on_attn_output: True
# extra_q_rms_per_head: True
mscale: 1.0

# RoPE — V4 two bases (10000 for pure-window layers, 160000 for compressed)
rope_type: "yarn"
rope_max_timescale: 10000
compress_rope_theta: 160000
max_position_embeddings: 4096
original_max_position_embeddings: 4096
rope_factor: 40
beta_fast: 32
beta_slow: 1
rope_interleave: True
rope_truncate: True
rope_attention_scaling: False

# Hybrid sliding + compressed attention
# TODO(V4): re-enable when compressor is implemented
sliding_window_size: 0                # disabled for now (V4 uses 16)
# compress_ratios: [16, 4, 16, 4, 16, 0, 0]  # TODO(V4): re-enable when compressor is implemented

# Indexer (only fires on ratio-4 layers)
# TODO: indexer requires dot_product or flash+tokamax_splash attention, not cudnn_flash_jax
use_indexer: False
indexer_variant: "v4"
indexer_n_heads: 2
indexer_head_dim: 16
indexer_topk: 8

# MTP — disabled by default, mirroring V3 convention (`deepseek3-tiny.yml` also leaves this off).
# To enable for the MTP code path test: override `mtp_num_layers=1 mtp_loss_scaling_factor=0.1` on the CLI
# (and extend compress_ratios with one extra entry once compress_ratios is re-enabled).
# Trainer gates everything MTP-related on `config.mtp_num_layers > 0`.
# mtp_num_layers: 1
# mtp_loss_scaling_factor: 0.1

# mHC
mhc_expansion_rate: 4
sinkhorn_iterations: 20
# learned_hc_head_collapse: True     # TODO(V4): implement LearnedHCHeadCollapse first

# Optimizer (Muon already supported for decoder_block: deepseek).
opt_type: "muon"
muon_beta: 0.95
muon_weight_decay: 0.0
muon_consistent_rms: 0.2
